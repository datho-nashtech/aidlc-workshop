<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Venue booking</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; }
      .shell { display: flex; gap: 1rem; align-items: center; padding: 1rem 2rem; background: #1f3b4d; color: #fff; }
      nav button, header button { margin-right: 0.35rem; }
      main { max-width: 960px; margin: 1.5rem auto; padding: 1.5rem; background: #fff; min-height: 70vh; }
      input, select, button { margin: 0.25rem 0.25rem 0.25rem 0; padding: 0.4rem 0.6rem; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApi } from "./src/api.js";
      import { createApp } from "./src/app.js";
      const baseUrl = window.U1_BASE_URL || localStorage.getItem("U1_BASE_URL") || "http://127.0.0.1:3001";
      const root = document.getElementById("app");
      const app = createApp({ root, api: createApi({ baseUrl }) });
      app.render();
      app.loadFields().then(() => app.render()).catch((err) => {
        root.querySelector("[data-testid=message]").textContent = err.message;
      });
    </script>
  </body>
</html>
